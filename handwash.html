<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Handwashing Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<style>
  :root{
    --sky:#6EC6E0;
    --sky-deep:#2E9BC2;
    --sky-pale:#DFF6FC;
    --sun:#FFC93C;
    --sun-deep:#F5A623;
    --pink:#FF8FA8;
    --pink-deep:#F2637E;
    --leaf:#7BD98D;
    --leaf-deep:#4CAF63;
    --cream:#FFFCF5;
    --ink:#1C4155;
    --ink-soft:#3E6478;
    --white:#FFFFFF;
    --shadow: 0 10px 0 rgba(28,65,85,0.12), 0 18px 30px rgba(28,65,85,0.14);
    --radius-lg: 34px;
    --radius-md: 24px;
    --radius-sm: 16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow-x:hidden;
    font-family:'Nunito', sans-serif;
    background: linear-gradient(180deg, var(--sky-pale) 0%, #EAF9FF 40%, #FFF7E8 100%);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', cursive;
    font-weight:800;
    margin:0;
  }
  button{ font-family:'Nunito', sans-serif; cursor:pointer; border:none; }
  #app{
    position:relative;
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:0;
    overflow:hidden;
  }

  /* ---------- floating bg bubbles ---------- */
  #bg-bubbles{
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .bg-bubble{
    position:absolute;
    bottom:-120px;
    border-radius:50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 55%, rgba(110,198,224,0.18) 100%);
    border:2px solid rgba(255,255,255,0.6);
    animation: floatUp linear infinite;
    opacity:0.8;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) scale(1); opacity:0; }
    8%{ opacity:0.85; }
    100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) scale(1.05); opacity:0; }
  }

  /* ---------- icon system (SVG based, no emoji-font dependency) ---------- */
  .icon-wrap{ display:inline-block; line-height:0; }
  .icon-wrap svg{ width:100%; height:100%; display:block; }
  .stage-icon{ width:clamp(90px,15vw,150px); height:clamp(90px,15vw,150px); margin:6px auto 20px; }
  .opt-icon{ width:clamp(46px,7vw,66px); height:clamp(46px,7vw,66px); margin:0 auto; }
  .welcome-icon{ width:clamp(80px,15vw,140px); height:clamp(80px,15vw,140px); }
  .mini-icon{ width:24px; height:24px; vertical-align:middle; }
  .seq-icon{ width:clamp(30px,5vw,44px); height:clamp(30px,5vw,44px); margin:0 auto; }
  .badge-icon{ width:20px; height:20px; vertical-align:middle; margin-right:4px; }
  .anim-wiggle{ animation:wiggle 0.6s ease-in-out infinite; }
  @keyframes wiggle{
    0%,100%{ transform:rotate(-8deg); }
    50%{ transform:rotate(8deg); }
  }
  .anim-circle{ animation:circleAround 1.4s linear infinite; }
  @keyframes circleAround{
    100%{ transform:rotate(360deg); }
  }
  .anim-scrub{ animation:scrub 0.35s ease-in-out infinite; }
  @keyframes scrub{
    0%,100%{ transform:translateX(-10px) rotate(-4deg); }
    50%{ transform:translateX(10px) rotate(4deg); }
  }
  .anim-roll{ animation:rollThumb 1.2s ease-in-out infinite; }
  @keyframes rollThumb{
    0%,100%{ transform:rotate(-15deg) scale(1); }
    50%{ transform:rotate(15deg) scale(1.1); }
  }
  .anim-stretch{ animation:stretchOut 1.1s ease-in-out infinite; }
  @keyframes stretchOut{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.22); }
  }
  .anim-interlock{ animation:interlockAnim 1s ease-in-out infinite; }
  @keyframes interlockAnim{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }
  .anim-bob{ animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-16px) rotate(2deg); }
  }

  /* ---------- top progress bar ---------- */
  #topbar{
    position:sticky; top:0; z-index:20;
    width:100%;
    display:flex; align-items:center; justify-content:center;
    gap:10px;
    padding:14px 16px 10px;
    background:linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0));
    backdrop-filter: blur(2px);
  }
  #topbar.hidden{ display:none; }
  .prog-title{
    font-family:'Baloo 2', cursive;
    font-size:clamp(15px, 2.2vw, 20px);
    color:var(--ink-soft);
    margin-right:8px;
    white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .prog-track{
    display:flex; gap:8px;
  }
  .prog-dot{
    width:clamp(26px,3.6vw,38px); height:clamp(26px,3.6vw,38px);
    border-radius:50%;
    background:#fff;
    border:3px solid var(--sky);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(12px,1.8vw,16px);
    font-weight:900;
    color:var(--sky-deep);
    transition: all .35s ease;
  }
  .prog-dot.done{
    background:var(--leaf);
    border-color:var(--leaf-deep);
    color:#fff;
    transform:scale(1.08);
  }
  .prog-dot.current{
    background:var(--sun);
    border-color:var(--sun-deep);
    color:#fff;
    box-shadow:0 0 0 6px rgba(255,201,60,0.25);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.15); }
  }

  /* ---------- screens ---------- */
  .screen{
    width:100%;
    max-width:980px;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 18px 100px;
    position:relative;
    z-index:5;
    text-align:center;
  }
  .screen.hidden{ display:none; }

  /* ---------- welcome ---------- */
  #welcome-char{
    display:flex; align-items:center; justify-content:center; gap:14px;
    filter:drop-shadow(0 10px 14px rgba(28,65,85,0.18));
  }
  .title-xxl{
    font-size:clamp(32px, 6.5vw, 62px);
    color:var(--sky-deep);
    line-height:1.05;
    margin-top:14px;
    text-shadow: 3px 3px 0 rgba(255,255,255,0.7);
  }
  .subtitle{
    font-size:clamp(16px, 2.6vw, 22px);
    color:var(--ink-soft);
    font-weight:700;
    max-width:560px;
    margin:14px auto 30px;
  }
  .big-btn{
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:clamp(20px, 3.2vw, 30px);
    color:#fff;
    background: linear-gradient(180deg, var(--leaf), var(--leaf-deep));
    padding: 18px 48px;
    border-radius: 999px;
    box-shadow: 0 8px 0 #3a8c4c, 0 16px 24px rgba(76,175,99,0.35);
    transition: transform .12s ease, box-shadow .12s ease;
    display:inline-flex; align-items:center; gap:12px;
  }
  .big-btn:active{
    transform:translateY(6px);
    box-shadow: 0 2px 0 #3a8c4c, 0 6px 14px rgba(76,175,99,0.3);
  }
  .mini-note{
    margin-top:26px;
    font-size:14px;
    color:var(--ink-soft);
    opacity:0.75;
    font-weight:700;
  }

  /* ---------- activity intro banner ---------- */
  .activity-banner{
    font-family:'Baloo 2', cursive;
    font-size:clamp(18px, 3.2vw, 28px);
    color:var(--sky-deep);
    background:#fff;
    padding:10px 26px;
    border-radius:999px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
    display:inline-flex; align-items:center; gap:10px;
  }

  /* ---------- question card ---------- */
  .qcard{
    background:var(--white);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:clamp(20px,3.5vw,40px);
    width:100%;
    max-width:820px;
    position:relative;
    animation: cardIn .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes cardIn{
    0%{ transform:scale(0.85) translateY(20px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  .qprompt{
    font-size:clamp(22px, 4vw, 34px);
    color:var(--ink);
    margin-bottom:6px;
    line-height:1.2;
  }
  .qsub{
    font-size:clamp(14px, 2vw, 18px);
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:22px;
  }

  .options-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
    margin-top:8px;
  }
  .options-grid.wide{ grid-template-columns:1fr; }
  .opt-card{
    background:var(--sky-pale);
    border:3px solid transparent;
    border-radius:var(--radius-md);
    padding: clamp(14px,2.4vw,22px) 12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    min-height:110px;
    transition: transform .12s ease, background .2s ease, border-color .2s ease;
    box-shadow: 0 6px 0 rgba(46,155,194,0.18);
  }
  .opt-card .opt-emoji{ font-size:clamp(34px, 6vw, 54px); line-height:1; }
  .opt-card .opt-label{
    font-family:'Baloo 2', cursive;
    font-size:clamp(15px, 2.4vw, 21px);
    color:var(--ink);
  }
  .opt-card:active{ transform:scale(0.96); }
  .opt-card:hover{ transform:translateY(-3px); background:#EAF7FC; }
  .opt-card.correct{
    background: linear-gradient(180deg, #DFF7E4, #C7F0D0);
    border-color:var(--leaf-deep);
    animation:correctPop .5s ease;
  }
  @keyframes correctPop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.12); }
    100%{ transform:scale(1.04); }
  }
  .opt-card.wrong{
    background: linear-gradient(180deg, #FFEDE0, #FFE1D0);
    border-color:#F2A46B;
    animation:shakeIt .45s ease;
    opacity:0.65;
  }
  @keyframes shakeIt{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-8px); }
    75%{ transform:translateX(8px); }
  }
  .opt-card.disabled{ pointer-events:none; }

  .feedback-msg{
    margin-top:20px;
    font-family:'Baloo 2', cursive;
    font-size:clamp(18px, 3vw, 26px);
    min-height:34px;
    color:var(--leaf-deep);
    transition:opacity .2s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .feedback-msg.silly{ color:var(--pink-deep); }

  /* sequence chain */
  .seq-chain{
    display:flex; align-items:flex-start; justify-content:center; flex-wrap:wrap; gap:6px;
    margin:16px 0 22px;
  }
  .seq-step{
    display:flex; flex-direction:column; align-items:center; gap:4px; min-width:74px;
  }
  .seq-step .seq-label{
    font-family:'Baloo 2', cursive;
    font-size:clamp(11px,1.6vw,14px);
    color:var(--ink-soft);
  }
  .seq-step.blank .seq-icon-holder{
    width:clamp(30px,5vw,44px); height:clamp(30px,5vw,44px);
    background:var(--sun);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; color:#fff; font-size:clamp(16px,2.4vw,22px);
  }
  .seq-step.blank .seq-label{ color:var(--sun-deep); }
  .seq-arrow{ font-size:22px; color:var(--sky); align-self:center; margin-top:10px; }

  /* ---------- celebration overlay ---------- */
  #celebration-overlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background: rgba(46,155,194,0.28);
    backdrop-filter: blur(3px);
  }
  #celebration-overlay.hidden{ display:none; }
  .celeb-card{
    background:#fff;
    border-radius:var(--radius-lg);
    padding:40px 46px;
    text-align:center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    animation: cardIn .4s cubic-bezier(.2,1.4,.4,1);
    max-width:520px;
  }
  .celeb-emoji{
    font-size:clamp(70px,10vw,110px);
    animation: celebBounce 0.7s ease-in-out infinite;
  }
  @keyframes celebBounce{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-18px) scale(1.08); }
  }
  .celeb-text{
    font-family:'Baloo 2', cursive;
    font-size:clamp(24px,4vw,36px);
    color:var(--sky-deep);
    margin-top:10px;
  }

  /* ---------- final screen ---------- */
  #screen-final .celeb-emoji{ font-size:clamp(90px, 16vw, 160px); }
  .stars-row{ font-size:clamp(28px,5vw,44px); margin:14px 0 6px; letter-spacing:6px; }
  .superstar-title{
    font-size:clamp(30px,6vw,54px);
    color:var(--sun-deep);
    text-shadow:2px 2px 0 rgba(255,255,255,0.7);
  }
  .final-sub{
    font-size:clamp(16px,2.6vw,22px);
    font-weight:800;
    color:var(--ink-soft);
    max-width:520px;
    margin:12px auto 28px;
  }
  .badge-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:14px;
    margin: 10px 0 30px;
  }
  .badge{
    background:#fff;
    border-radius:20px;
    padding:14px 18px;
    box-shadow:var(--shadow);
    font-family:'Baloo 2', cursive;
    font-size:clamp(14px,2vw,18px);
    display:flex; align-items:center; gap:8px;
    color:var(--ink);
  }

  /* ---------- teacher controls ---------- */
  #teacher-controls{
    position:fixed; bottom:14px; right:14px; z-index:40;
    display:flex; gap:10px;
  }
  .tc-btn{
    background:rgba(255,255,255,0.9);
    border:2px solid var(--sky);
    color:var(--ink);
    font-weight:800;
    font-size:14px;
    padding:10px 16px;
    border-radius:999px;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
    display:flex; align-items:center; gap:6px;
  }
  .tc-btn:active{ transform:scale(0.95); }

  @media (max-width:520px){
    .options-grid{ grid-template-columns:repeat(2,1fr); }
    #teacher-controls{ bottom:8px; right:8px; }
    .tc-btn{ padding:8px 12px; font-size:12px; }
  }
  @media (max-width:380px){
    .celeb-card{ padding:28px 22px; }
  }
</style>
</head>
<body>

<div id="bg-bubbles"></div>

<div id="app">

  <div id="topbar" class="hidden">
    <span class="prog-title" id="prog-title-label">Adventure</span>
    <div class="prog-track" id="prog-track"></div>
  </div>

  <!-- WELCOME SCREEN -->
  <section id="screen-welcome" class="screen">
    <div id="welcome-char" class="anim-bob"></div>
    <h1 class="title-xxl">Handwashing<br>Adventure!</h1>
    <p class="subtitle">Let's play games and show what you know about washing your hands clean and shiny!</p>
    <button class="big-btn" id="btn-start">▶️ Start Game</button>
    <p class="mini-note">Teacher: tap Start when your class is ready</p>
  </section>

  <!-- GAME SCREEN -->
  <section id="screen-game" class="screen hidden">
    <div class="activity-banner" id="activity-banner"></div>
    <div class="qcard" id="qcard"></div>
  </section>

  <!-- FINAL SCREEN -->
  <section id="screen-final" class="screen hidden">
    <div class="celeb-emoji">🏆</div>
    <div class="stars-row">⭐⭐⭐⭐⭐</div>
    <h1 class="superstar-title">You are a<br>HANDWASHING<br>SUPERSTAR!</h1>
    <p class="final-sub">You know so much about clean hands, bubbly soap, and shiny fingers!</p>
    <div class="badge-row" id="badge-row"></div>
    <button class="big-btn" id="btn-replay">🔁 Play Again</button>
  </section>

</div>

<!-- CELEBRATION OVERLAY -->
<div id="celebration-overlay" class="hidden">
  <div class="celeb-card">
    <div class="celeb-emoji" id="celeb-emoji">🎉</div>
    <div class="celeb-text" id="celeb-text">Amazing!</div>
  </div>
</div>

<div id="teacher-controls">
  <button class="tc-btn" id="btn-skip">⏭️ Next</button>
  <button class="tc-btn" id="btn-restart">🔄 Restart</button>
</div>

<script>
/* ============================================================
   ICON LIBRARY — hand-drawn SVGs (no reliance on emoji fonts,
   so nothing breaks on classroom projectors / Android TV browsers)
   ============================================================ */
const ICONS = {
  soap: `<svg viewBox="0 0 100 100"><rect x="15" y="35" width="70" height="40" rx="18" fill="#FFFFFF" stroke="#2E9BC2" stroke-width="5"/><circle cx="30" cy="25" r="6" fill="#DFF6FC" stroke="#6EC6E0" stroke-width="3"/><circle cx="45" cy="17" r="8" fill="#DFF6FC" stroke="#6EC6E0" stroke-width="3"/><circle cx="63" cy="24" r="5" fill="#DFF6FC" stroke="#6EC6E0" stroke-width="3"/></svg>`,
  liquidsoap: `<svg viewBox="0 0 100 100"><rect x="30" y="35" width="40" height="50" rx="10" fill="#FF8FA8" stroke="#F2637E" stroke-width="5"/><rect x="42" y="18" width="16" height="18" rx="4" fill="#F2637E"/><rect x="36" y="10" width="26" height="8" rx="4" fill="#FF8FA8" stroke="#F2637E" stroke-width="3"/><circle cx="70" cy="20" r="4" fill="#6EC6E0"/></svg>`,
  faucet: `<svg viewBox="0 0 100 100"><rect x="18" y="18" width="18" height="32" rx="6" fill="#B8C4CC" stroke="#8494A0" stroke-width="4"/><path d="M36 24 h28 a10 10 0 0 1 10 10 v9" fill="none" stroke="#8494A0" stroke-width="8" stroke-linecap="round"/><path d="M74 43 v10" stroke="#6EC6E0" stroke-width="6" stroke-linecap="round"/><circle cx="74" cy="62" r="4" fill="#6EC6E0"/><circle cx="74" cy="74" r="3" fill="#6EC6E0"/></svg>`,
  basin: `<svg viewBox="0 0 100 100"><path d="M15 45 q35 22 70 0 v8 q-35 24 -70 0 z" fill="#DFF6FC" stroke="#2E9BC2" stroke-width="5"/><ellipse cx="50" cy="45" rx="35" ry="13" fill="#FFFFFF" stroke="#2E9BC2" stroke-width="5"/><rect x="44" y="65" width="12" height="18" fill="#B8C4CC"/><rect x="28" y="82" width="44" height="6" rx="3" fill="#8494A0"/></svg>`,
  towel: `<svg viewBox="0 0 100 100"><rect x="15" y="25" width="70" height="50" rx="8" fill="#FFC93C" stroke="#F5A623" stroke-width="5"/><line x1="15" y1="45" x2="85" y2="45" stroke="#F5A623" stroke-width="4"/><line x1="15" y1="60" x2="85" y2="60" stroke="#F5A623" stroke-width="4"/></svg>`,
  water: `<svg viewBox="0 0 100 100"><path d="M50 12 C65 38 78 52 78 68 a28 28 0 0 1 -56 0 C22 52 35 38 50 12 Z" fill="#6EC6E0" stroke="#2E9BC2" stroke-width="5"/><ellipse cx="40" cy="65" rx="6" ry="9" fill="#DFF6FC"/></svg>`,
  bubbles: `<svg viewBox="0 0 100 100"><circle cx="30" cy="58" r="19" fill="#DFF6FC" stroke="#6EC6E0" stroke-width="4"/><circle cx="62" cy="42" r="25" fill="#FFFFFF" stroke="#6EC6E0" stroke-width="4"/><circle cx="76" cy="70" r="11" fill="#DFF6FC" stroke="#6EC6E0" stroke-width="3"/></svg>`,
  wiggle: `<svg viewBox="0 0 100 100"><g fill="#FFE0C2" stroke="#F2A46B" stroke-width="4" stroke-linejoin="round"><rect x="44" y="14" width="10" height="34" rx="5"/><rect x="29" y="20" width="10" height="34" rx="5"/><rect x="59" y="20" width="10" height="34" rx="5"/><rect x="15" y="30" width="10" height="30" rx="5"/><rect x="73" y="30" width="10" height="30" rx="5"/><path d="M17 55 h64 v18 a20 20 0 0 1 -20 20 h-24 a20 20 0 0 1 -20 -20 z"/></g></svg>`,
  circle: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="8" fill="#FFC93C"/><path d="M50 20 a30 30 0 1 1 -21 8.6" fill="none" stroke="#2E9BC2" stroke-width="6" stroke-linecap="round"/><path d="M22 22 l7 9 l-11 2 z" fill="#2E9BC2"/></svg>`,
  scrub: `<svg viewBox="0 0 100 100"><ellipse cx="38" cy="55" rx="27" ry="20" fill="#FFE0C2" stroke="#F2A46B" stroke-width="4"/><ellipse cx="63" cy="55" rx="27" ry="20" fill="#FFD9B0" stroke="#F2A46B" stroke-width="4" opacity="0.9"/><circle cx="24" cy="24" r="4" fill="#6EC6E0"/><circle cx="76" cy="27" r="5" fill="#6EC6E0"/><circle cx="50" cy="16" r="3" fill="#6EC6E0"/></svg>`,
  roll: `<svg viewBox="0 0 100 100"><path d="M35 45 v35 h-11 a6 6 0 0 1 -6 -6 v-23 a6 6 0 0 1 6 -6 z" fill="#FFE0C2" stroke="#F2A46B" stroke-width="4"/><path d="M35 45 l9 -26 a7 7 0 0 1 13 3 l-3 15 h18 a7 7 0 0 1 7 9 l-6 24 a10 10 0 0 1 -10 8 h-28 z" fill="#FFE0C2" stroke="#F2A46B" stroke-width="4"/><path d="M70 14 a20 20 0 1 1 -14 6" fill="none" stroke="#7BD98D" stroke-width="5" stroke-linecap="round"/></svg>`,
  stretch: `<svg viewBox="0 0 100 100"><ellipse cx="28" cy="55" rx="18" ry="27" fill="#FFE0C2" stroke="#F2A46B" stroke-width="4"/><ellipse cx="72" cy="55" rx="18" ry="27" fill="#FFE0C2" stroke="#F2A46B" stroke-width="4"/><path d="M8 50 l-8 5 8 5" fill="none" stroke="#2E9BC2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 50 l8 5 -8 5" fill="none" stroke="#2E9BC2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  interlock: `<svg viewBox="0 0 100 100"><path d="M20 70 q15 -42 35 -10 q20 -32 35 10" fill="none" stroke="#F2A46B" stroke-width="9" stroke-linecap="round"/><path d="M20 70 q30 20 60 0" fill="none" stroke="#FFE0C2" stroke-width="15" stroke-linecap="round"/></svg>`,
};
function iconHTML(key, sizeClass){
  return `<span class="icon-wrap ${sizeClass}">${ICONS[key] || ''}</span>`;
}

/* ============================================================
   VOCABULARY DATA — sourced from the handwashing vocabulary PDF
   All emoji used below are older, widely-supported Unicode 6-9
   characters so they render reliably on classroom / Android TV browsers.
   ============================================================ */
const OBJECTS = [
  {id:'soap', icon:'soap', label:'Soap'},
  {id:'liquidsoap', icon:'liquidsoap', label:'Liquid Soap'},
  {id:'faucet', icon:'faucet', label:'Faucet'},
  {id:'basin', icon:'basin', label:'Basin'},
  {id:'towel', icon:'towel', label:'Towel'},
  {id:'water', icon:'water', label:'Water Drop'},
];

const ACTIONS = [
  {id:'wiggle', icon:'wiggle', anim:'anim-wiggle', label:'Wiggle'},
  {id:'circle', icon:'circle', anim:'anim-circle', label:'Circle Around'},
  {id:'scrub', icon:'scrub', anim:'anim-scrub', label:'Scrub'},
  {id:'roll', icon:'roll', anim:'anim-roll', label:'Thumb Roll'},
  {id:'stretch', icon:'stretch', anim:'anim-stretch', label:'Stretch'},
  {id:'interlock', icon:'interlock', anim:'anim-interlock', label:'Interlock'},
];

const DISTRACTOR_ITEMS = [
  {emoji:'🚗', label:'Car'}, {emoji:'📚', label:'Book'}, {emoji:'🍎', label:'Apple'},
  {emoji:'⚽', label:'Ball'}, {emoji:'🐻', label:'Bear'}, {emoji:'🎈', label:'Balloon'},
  {emoji:'🎨', label:'Paint'}, {emoji:'🎸', label:'Guitar'}, {emoji:'🐬', label:'Dolphin'},
];

const SEQUENCE_QUESTIONS = [
  { before:['Turn on Faucet'], blankAnswer:'Get Soap', after:['Scrub Hands','Rinse','Dry Hands'],
    options:['Get Soap','Dry Hands','Turn off Faucet','Eat Lunch'] },
  { before:['Get Soap','Scrub Hands'], blankAnswer:'Rinse', after:['Dry Hands'],
    options:['Rinse','Turn on Faucet','Draw a Picture','Play Blocks'] },
  { before:[], blankAnswer:'Turn on Faucet', after:['Get Soap','Scrub Hands','Rinse','Dry Hands'],
    options:['Turn on Faucet','Watch TV','Dry Hands','Sing a Song'] },
];
/* each entry: {type:'icon', value: ICONS key} OR {type:'emoji', value: char} */
const SEQ_ICON_MAP = {
  'Turn on Faucet': {type:'icon', value:'faucet'},
  'Get Soap': {type:'icon', value:'soap'},
  'Scrub Hands': {type:'icon', value:'scrub'},
  'Rinse': {type:'icon', value:'water'},
  'Dry Hands': {type:'icon', value:'towel'},
  'Turn off Faucet': {type:'emoji', value:'🚱'},
  'Eat Lunch': {type:'emoji', value:'🍴'},
  'Draw a Picture': {type:'emoji', value:'🎨'},
  'Play Blocks': {type:'emoji', value:'🧱'},
  'Watch TV': {type:'emoji', value:'📺'},
  'Sing a Song': {type:'emoji', value:'🎵'},
};
function seqStepHTML(label){
  const entry = SEQ_ICON_MAP[label];
  if(!entry) return `<span class="seq-icon">❓</span>`;
  if(entry.type === 'icon') return iconHTML(entry.value, 'seq-icon');
  return `<div class="seq-icon" style="font-size:clamp(24px,4vw,36px);line-height:1;">${entry.value}</div>`;
}

const TRUE_SILLY = [
  {text:'We use soap to make our hands clean.', truth:true},
  {text:'We dry our wet hands with a banana.', truth:false},
  {text:'Water comes out of the faucet.', truth:true},
  {text:'We wiggle our fingers to wash between them.', truth:true},
  {text:'We wash our hands with dirt to make them clean.', truth:false},
  {text:'We scrub our palms with soap.', truth:true},
  {text:'We dry our hands with a towel.', truth:true},
  {text:'We interlock our fingers to clean between them.', truth:true},
  {text:'We wash our hands with a shoe.', truth:false},
];

const CORRECT_MSGS = [
  ['🎉','Amazing!'], ['🌟','Super!'], ['😄','You got it!'],
  ['✨','Clean hands champion!'], ['⭐','Fantastic!'], ['👏','Well done!']
];
const TRY_AGAIN_MSGS = ['Almost! Try again!','Let\'s look carefully!','Good try!'];

/* ============================================================
   UTILITIES
   ============================================================ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pick(arr,n){ return shuffle(arr).slice(0,n); }
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ============================================================
   BUILD QUESTION SETS PER ACTIVITY (3 questions each)
   Every builder tags its questions with a `type` field —
   the renderer switches on this, so a missing type = a blank card.
   ============================================================ */
function buildWhichOne(){
  return pick(OBJECTS,3).map(target=>{
    const distractors = pick(OBJECTS.filter(o=>o.id!==target.id),3);
    const options = shuffle([target,...distractors]);
    return {type:'whichOne', target, options};
  });
}
function buildFindPicture(){
  return pick(OBJECTS,3).map(target=>{
    const distractors = pick(OBJECTS.filter(o=>o.id!==target.id),3);
    const options = shuffle([target,...distractors]);
    return {type:'findPicture', target, options};
  });
}
function buildSequence(){
  return shuffle(SEQUENCE_QUESTIONS).map(q => ({...q, type:'whatComesNext'}));
}
function buildMatchIt(){
  return pick(ACTIONS,3).map(target=>{
    const distractors = pick(ACTIONS.filter(a=>a.id!==target.id),3);
    const options = shuffle([target,...distractors]);
    return {type:'matchIt', target, options};
  });
}
function buildSpotHero(){
  return pick(OBJECTS,3).map(target=>{
    const distractors = pick(DISTRACTOR_ITEMS,3);
    const options = shuffle([
      {icon:target.icon, label:target.label, isHero:true},
      ...distractors.map(d=>({emoji:d.emoji, label:d.label, isHero:false}))
    ]);
    return {type:'spotHero', target, options};
  });
}
function buildTrueSilly(){
  const trues = pick(TRUE_SILLY.filter(t=>t.truth), 2);
  const sillies = pick(TRUE_SILLY.filter(t=>!t.truth), 1);
  return shuffle([...trues, ...sillies]).map(q => ({...q, type:'trueOrSilly'}));
}

const ACTIVITIES = [
  { key:'whichOne', title:'Which One?', icon:'❓', build:buildWhichOne },
  { key:'findPicture', title:'Find the Right Picture', icon:'👉', build:buildFindPicture },
  { key:'whatComesNext', title:'What Comes Next?', icon:'➡️', build:buildSequence },
  { key:'matchIt', title:'Match It!', icon:'🔗', build:buildMatchIt },
  { key:'spotHero', title:'Spot the Handwashing Hero!', icon:'🔍', build:buildSpotHero },
  { key:'trueOrSilly', title:'True or Silly?', icon:'🤔', build:buildTrueSilly },
];

/* ============================================================
   GAME STATE
   ============================================================ */
let state = {
  activityIndex: 0,
  questionIndex: 0,
  questions: [],
  correctCount: 0,
  totalCount: 0,
};

const qcard = document.getElementById('qcard');
const activityBanner = document.getElementById('activity-banner');
const progTrack = document.getElementById('prog-track');
const topbar = document.getElementById('topbar');

function initProgressBar(){
  progTrack.innerHTML = '';
  ACTIVITIES.forEach((a,i)=>{
    const dot = document.createElement('div');
    dot.className = 'prog-dot';
    dot.id = 'prog-dot-'+i;
    dot.textContent = a.icon;
    progTrack.appendChild(dot);
  });
}
function updateProgressBar(){
  ACTIVITIES.forEach((a,i)=>{
    const dot = document.getElementById('prog-dot-'+i);
    dot.classList.remove('current','done');
    if(i < state.activityIndex) dot.classList.add('done');
    else if(i === state.activityIndex) dot.classList.add('current');
  });
}

function startGame(){
  document.getElementById('screen-welcome').classList.add('hidden');
  document.getElementById('screen-final').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');
  topbar.classList.remove('hidden');
  state.activityIndex = 0;
  state.correctCount = 0;
  state.totalCount = 0;
  initProgressBar();
  loadActivity(0);
}

function loadActivity(index){
  if(index >= ACTIVITIES.length){
    showFinalScreen();
    return;
  }
  state.activityIndex = index;
  state.questionIndex = 0;
  state.questions = ACTIVITIES[index].build();
  updateProgressBar();
  activityBanner.innerHTML = `<span>${ACTIVITIES[index].icon}</span><span>${ACTIVITIES[index].title}</span>`;
  renderQuestion();
}

function nextQuestion(){
  state.questionIndex++;
  if(state.questionIndex >= state.questions.length){
    showActivityCelebration(()=> loadActivity(state.activityIndex+1));
  } else {
    renderQuestion();
  }
}

function renderQuestion(){
  const q = state.questions[state.questionIndex];
  qcard.innerHTML = '';
  state.totalCount++;

  if(!q){ return; }

  if(q.type === 'whichOne'){
    renderPictureQuestion(q);
  } else if(q.type === 'findPicture'){
    renderWordThenPictures(q);
  } else if(q.type === 'whatComesNext'){
    renderSequenceQuestion(q);
  } else if(q.type === 'matchIt'){
    renderMatchIt(q);
  } else if(q.type === 'spotHero'){
    renderSpotHero(q);
  } else if(q.type === 'trueOrSilly'){
    renderTrueSilly(q);
  } else {
    /* Fallback safety net: never leave a blank card */
    qcard.innerHTML = `<div class="qprompt">Hmm, let's try the next one!</div>`;
    setTimeout(nextQuestion, 600);
  }
}

/* ---------- Activity 1: Which One? (show picture, choose word) ---------- */
function renderPictureQuestion(q){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="qprompt">What is this?</div>
    <div class="qsub">Tap the word that matches the picture</div>
    <div class="stage-icon">${ICONS[q.target.icon]}</div>
    <div class="options-grid" id="opts"></div>
    <div class="feedback-msg" id="fb"></div>
  `;
  qcard.appendChild(wrap);
  const optsEl = wrap.querySelector('#opts');
  q.options.forEach(opt=>{
    const btn = document.createElement('div');
    btn.className = 'opt-card';
    btn.innerHTML = `<div class="opt-label">${opt.label}</div>`;
    btn.addEventListener('click', ()=> handleAnswer(opt.id === q.target.id, btn, wrap));
    optsEl.appendChild(btn);
  });
}

/* ---------- Activity 2: Find the Right Picture (show word, choose picture) ---------- */
function renderWordThenPictures(q){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="qprompt">Find the ${q.target.label}!</div>
    <div class="qsub">Tap the correct picture</div>
    <div class="options-grid" id="opts"></div>
    <div class="feedback-msg" id="fb"></div>
  `;
  qcard.appendChild(wrap);
  const optsEl = wrap.querySelector('#opts');
  q.options.forEach(opt=>{
    const btn = document.createElement('div');
    btn.className = 'opt-card';
    btn.innerHTML = iconHTML(opt.icon, 'opt-icon');
    btn.addEventListener('click', ()=> handleAnswer(opt.id === q.target.id, btn, wrap));
    optsEl.appendChild(btn);
  });
}

/* ---------- Activity 3: What Comes Next? ---------- */
function renderSequenceQuestion(q){
  const wrap = document.createElement('div');
  const chain = [
    ...q.before.map(s=>({label:s, known:true})),
    {label:'?', known:false},
    ...q.after.map(s=>({label:s, known:true}))
  ];
  const chainHtml = chain.map(step=>{
    if(step.known){
      return `<div class="seq-step">${seqStepHTML(step.label)}<div class="seq-label">${step.label}</div></div>`;
    }
    return `<div class="seq-step blank"><div class="seq-icon-holder">?</div><div class="seq-label">?</div></div>`;
  }).join(`<div class="seq-arrow">&#10132;</div>`);

  wrap.innerHTML = `
    <div class="qprompt">What Comes Next?</div>
    <div class="qsub">Pick what belongs in the missing spot</div>
    <div class="seq-chain">${chainHtml}</div>
    <div class="options-grid" id="opts"></div>
    <div class="feedback-msg" id="fb"></div>
  `;
  qcard.appendChild(wrap);
  const optsEl = wrap.querySelector('#opts');
  shuffle(q.options).forEach(optLabel=>{
    const btn = document.createElement('div');
    btn.className = 'opt-card';
    btn.innerHTML = `${seqStepHTML(optLabel)}<div class="opt-label">${optLabel}</div>`;
    btn.addEventListener('click', ()=> handleAnswer(optLabel === q.blankAnswer, btn, wrap));
    optsEl.appendChild(btn);
  });
}

/* ---------- Activity 4: Match It! ---------- */
function renderMatchIt(q){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="qprompt">What are the hands doing?</div>
    <div class="qsub">Watch closely, then tap the matching word</div>
    <div class="stage-icon ${q.target.anim}">${ICONS[q.target.icon]}</div>
    <div class="options-grid" id="opts"></div>
    <div class="feedback-msg" id="fb"></div>
  `;
  qcard.appendChild(wrap);
  const optsEl = wrap.querySelector('#opts');
  q.options.forEach(opt=>{
    const btn = document.createElement('div');
    btn.className = 'opt-card';
    btn.innerHTML = `<div class="opt-label">${opt.label}</div>`;
    btn.addEventListener('click', ()=> handleAnswer(opt.id === q.target.id, btn, wrap));
    optsEl.appendChild(btn);
  });
}

/* ---------- Activity 5: Spot the Handwashing Hero! ---------- */
function renderSpotHero(q){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="qprompt">Spot the Handwashing Hero!</div>
    <div class="qsub">Which one helps us wash our hands?</div>
    <div class="options-grid" id="opts"></div>
    <div class="feedback-msg" id="fb"></div>
  `;
  qcard.appendChild(wrap);
  const optsEl = wrap.querySelector('#opts');
  q.options.forEach(opt=>{
    const btn = document.createElement('div');
    btn.className = 'opt-card';
    const visual = opt.icon ? iconHTML(opt.icon,'opt-icon') : `<div class="opt-emoji">${opt.emoji}</div>`;
    btn.innerHTML = `${visual}<div class="opt-label">${opt.label}</div>`;
    btn.addEventListener('click', ()=> handleAnswer(opt.isHero === true, btn, wrap));
    optsEl.appendChild(btn);
  });
}

/* ---------- Activity 6: True or Silly? ---------- */
function renderTrueSilly(q){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="qprompt">"${q.text}"</div>
    <div class="qsub">Is that true, or is it silly?</div>
    <div class="options-grid" id="opts"></div>
    <div class="feedback-msg" id="fb"></div>
  `;
  qcard.appendChild(wrap);
  const optsEl = wrap.querySelector('#opts');
  const choices = [
    {val:true, emoji:'✅', label:'YES'},
    {val:false, emoji:'❌', label:'NO, SILLY!'}
  ];
  choices.forEach(c=>{
    const btn = document.createElement('div');
    btn.className = 'opt-card';
    btn.innerHTML = `<div class="opt-emoji">${c.emoji}</div><div class="opt-label">${c.label}</div>`;
    btn.addEventListener('click', ()=> handleAnswer(c.val === q.truth, btn, wrap));
    optsEl.appendChild(btn);
  });
}

/* ============================================================
   ANSWER HANDLING
   ============================================================ */
function handleAnswer(isCorrect, btnEl, wrapEl){
  const opts = wrapEl.querySelectorAll('.opt-card');
  const fb = wrapEl.querySelector('#fb');

  if(isCorrect){
    opts.forEach(o=>o.classList.add('disabled'));
    btnEl.classList.add('correct');
    state.correctCount++;
    const [emoji,msg] = rand(CORRECT_MSGS);
    fb.textContent = `${emoji} ${msg}`;
    fb.classList.remove('silly');
    fireConfetti();
    setTimeout(()=> nextQuestion(), 1300);
  } else {
    btnEl.classList.add('wrong');
    btnEl.classList.add('disabled');
    fb.textContent = rand(TRY_AGAIN_MSGS);
    fb.classList.add('silly');
    setTimeout(()=>{ fb.textContent=''; fb.classList.remove('silly'); }, 1600);
  }
}

function fireConfetti(){
  if(typeof confetti !== 'function') return;
  confetti({
    particleCount: 70,
    spread: 65,
    origin: { y: 0.6 },
    colors: ['#FFC93C','#7BD98D','#6EC6E0','#FF8FA8','#FFFFFF']
  });
}

function showActivityCelebration(cb){
  const overlay = document.getElementById('celebration-overlay');
  const emojiEl = document.getElementById('celeb-emoji');
  const textEl = document.getElementById('celeb-text');
  const [emoji,msg] = rand(CORRECT_MSGS);
  emojiEl.textContent = emoji;
  textEl.textContent = msg + ' Activity complete!';
  overlay.classList.remove('hidden');
  fireConfetti();
  setTimeout(fireConfetti, 300);
  setTimeout(()=>{
    overlay.classList.add('hidden');
    cb();
  }, 1700);
}

/* ============================================================
   FINAL SCREEN
   ============================================================ */
function showFinalScreen(){
  document.getElementById('screen-game').classList.add('hidden');
  topbar.classList.add('hidden');
  const finalScreen = document.getElementById('screen-final');
  finalScreen.classList.remove('hidden');
  const badgeRow = document.getElementById('badge-row');
  badgeRow.innerHTML = ACTIVITIES.map(a=>`<div class="badge">${a.icon} ${a.title}</div>`).join('');
  fireConfetti();
  setTimeout(fireConfetti, 300);
  setTimeout(fireConfetti, 650);
}

/* ============================================================
   TEACHER CONTROLS
   ============================================================ */
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-replay').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', ()=>{
  document.getElementById('celebration-overlay').classList.add('hidden');
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-final').classList.add('hidden');
  topbar.classList.add('hidden');
  document.getElementById('screen-welcome').classList.remove('hidden');
});
document.getElementById('btn-skip').addEventListener('click', ()=>{
  const gameVisible = !document.getElementById('screen-game').classList.contains('hidden');
  if(gameVisible){
    nextQuestion();
  }
});

/* ============================================================
   WELCOME CHARACTER + PROGRESS LABEL ICONS
   ============================================================ */
document.getElementById('welcome-char').innerHTML =
  iconHTML('soap','welcome-icon') + iconHTML('bubbles','welcome-icon');
document.getElementById('prog-title-label').innerHTML =
  iconHTML('soap','mini-icon') + ' Adventure';

/* ============================================================
   BACKGROUND BUBBLES
   ============================================================ */
function spawnBubble(){
  const b = document.createElement('div');
  b.className = 'bg-bubble';
  const size = 18 + Math.random()*46;
  b.style.width = size+'px';
  b.style.height = size+'px';
  b.style.left = (Math.random()*100)+'vw';
  const duration = 9 + Math.random()*9;
  b.style.animationDuration = duration+'s';
  b.style.setProperty('--drift', (Math.random()*80-40)+'px');
  document.getElementById('bg-bubbles').appendChild(b);
  setTimeout(()=> b.remove(), duration*1000 + 500);
}
setInterval(spawnBubble, 900);
for(let i=0;i<6;i++) setTimeout(spawnBubble, i*300);
</script>
