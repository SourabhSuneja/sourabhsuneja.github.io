<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Data Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- Layout concept: same village-path chrome as the other learning towns, but the
     play-zone is built around one reusable component — a live pictogram (label + icon row) —
     that is read, compared, filled from a tally, and built up across the levels. ---------- */
  :root{
    color-scheme: light;

    --teal-900:#0d3841; --teal-800:#124f59; --teal-700:#1b6b78; --teal-600:#227d8b; --teal-100:#e3eef0;
    --gold-600:#e2941a; --gold-500:#f5a623; --gold-400:#ffc65c; --gold-100:#fdf1dc;
    --cream:#faf8f3; --ink-900:#1c2626; --ink-500:#5f6f70; --white:#ffffff;

    --bg-tint-gold: rgba(245,166,35,.10);
    --bg-tint-teal: rgba(27,107,120,.10);
    --border-card: rgba(13,56,65,.08);

    --fun-red:#f2555a; --fun-orange:#ff9f45; --fun-yellow:#ffd85c; --fun-green:#4fc98a;
    --fun-blue:#4aa8e0; --fun-purple:#a679e0; --fun-pink:#ff8fc0; --char-line:#2a2a2a;

    --grass:var(--fun-green); --grass-dark:#399c6c;
    --sun:var(--gold-500); --sun-dark:var(--gold-600);
    --berry:var(--fun-red); --berry-dark:#d1454a;
    --plum:var(--ink-900); --ink-soft:var(--ink-500);
    --purple: var(--fun-purple);

    --panel-tint: var(--bg-tint-teal);
    --bubble-tint: var(--bg-tint-gold);
    --input-bg: color-mix(in srgb, var(--white) 97%, var(--ink-900) 3%);
    --input-border: color-mix(in srgb, var(--ink-900) 16%, transparent);
    --cloud-tint: rgba(255,255,255,.85);
    --overlay-tint: color-mix(in srgb, var(--teal-900) 55%, transparent);
    --overlay-tint-strong: color-mix(in srgb, var(--teal-900) 62%, transparent);
    --edge-shadow: rgba(13,56,65,.14);
    --edge-shadow-soft: rgba(13,56,65,.08);

    --r-lg:26px; --r-md:18px; --r-sm:14px;
    --ease:cubic-bezier(.22,1,.36,1);

    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Manrope',system-ui,sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --teal-900:#092227; --teal-800:#8fe1ec; --teal-700:#5fd0de; --teal-600:#7fdbe6; --teal-100:#173338;
      --gold-600:#ffb648; --gold-500:#ffc65c; --gold-400:#ffd685; --gold-100:#2b2110;
      --cream:#0d1517; --ink-900:#eef3f2; --ink-500:#a4b6b7; --white:#182425;
      --bg-tint-gold: rgba(255,182,72,.08); --bg-tint-teal: rgba(95,208,222,.12); --border-card: rgba(255,255,255,.10);
      --char-line:#0d1517; --grass-dark:#2c8f60; --berry-dark:#c23b41;
      --input-bg: color-mix(in srgb, var(--white) 90%, black 10%);
      --input-border: color-mix(in srgb, var(--white) 22%, transparent);
      --cloud-tint: rgba(255,255,255,.14);
      --edge-shadow: rgba(0,0,0,.5); --edge-shadow-soft: rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --teal-900:#092227; --teal-800:#8fe1ec; --teal-700:#5fd0de; --teal-600:#7fdbe6; --teal-100:#173338;
    --gold-600:#ffb648; --gold-500:#ffc65c; --gold-400:#ffd685; --gold-100:#2b2110;
    --cream:#0d1517; --ink-900:#eef3f2; --ink-500:#a4b6b7; --white:#182425;
    --bg-tint-gold: rgba(255,182,72,.08); --bg-tint-teal: rgba(95,208,222,.12); --border-card: rgba(255,255,255,.10);
    --char-line:#0d1517; --grass-dark:#2c8f60; --berry-dark:#c23b41;
    --input-bg: color-mix(in srgb, var(--white) 90%, black 10%);
    --input-border: color-mix(in srgb, var(--white) 22%, transparent);
    --cloud-tint: rgba(255,255,255,.14);
    --edge-shadow: rgba(0,0,0,.5); --edge-shadow-soft: rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;min-height:100%;
    font-family:var(--font-body); color:var(--plum);
    background:linear-gradient(180deg,var(--bg-tint-teal) 0%, var(--cream) 55%, var(--bg-tint-gold) 100%);
    overflow-x:hidden; position:relative;
    transition:background .3s var(--ease), color .3s var(--ease);
  }
  .side-pad{ padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }

  /* ---------- decorative sky ---------- */
  .sky-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .sun-decor{
    position:absolute;top:-40px;right:6%;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--gold-400), var(--sun) 70%);
    box-shadow:0 0 60px 20px rgba(245,166,35,.35); animation:pulse 4s ease-in-out infinite;
  }
  .cloud{position:absolute;background:var(--cloud-tint);border-radius:50px;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:var(--cloud-tint);border-radius:50%;}
  .cloud1{width:110px;height:36px;top:8%;left:5%;animation:drift 34s linear infinite;}
  .cloud1::before{width:55px;height:55px;top:-26px;left:12px;}
  .cloud1::after{width:40px;height:40px;top:-18px;left:55px;}
  .cloud2{width:90px;height:30px;top:16%;left:70%;animation:drift 26s linear infinite reverse;}
  .cloud2::before{width:44px;height:44px;top:-20px;left:8px;}
  .cloud2::after{width:34px;height:34px;top:-14px;left:44px;}
  .cloud3{width:70px;height:24px;top:32%;left:40%;animation:drift 40s linear infinite;}
  .cloud3::before{width:34px;height:34px;top:-16px;left:6px;}
  .cloud3::after{width:26px;height:26px;top:-10px;left:34px;}
  @keyframes drift{from{transform:translateX(-10vw);}to{transform:translateX(110vw);}}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

  /* ---------- top bar ---------- */
  .top-bar{ position:relative;z-index:2; display:flex;align-items:center;justify-content:space-between; padding-block:14px; gap:12px; flex-wrap:wrap; }
  .brand{ display:flex;align-items:center;gap:10px; font-family:var(--font-display);font-weight:700; font-size:clamp(20px,3vw,28px);color:var(--plum); }
  .brand .mascot-mini{font-size:1.4em;animation:bob 2.4s ease-in-out infinite;display:inline-block;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(3deg);}}
  .top-right{display:flex;align-items:center;gap:10px;}
  .stars-counter{
    display:flex;align-items:center;gap:6px; background:var(--white);border:3px solid var(--sun);
    border-radius:999px;padding:8px 16px; font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--edge-shadow-soft);
    color:var(--plum); font-variant-numeric:tabular-nums;
  }
  .icon-btn{
    width:46px;height:46px;border-radius:50%;border:3px solid var(--white); background:var(--white);
    font-size:20px;cursor:pointer;box-shadow:0 4px 0 var(--edge-shadow-soft);
    display:flex;align-items:center;justify-content:center;transition:transform .15s ease;
  }
  .icon-btn:hover{transform:translateY(-2px) scale(1.05);}
  .icon-btn:active{transform:translateY(1px) scale(.97);}
  .icon-btn:focus-visible, .choice-btn:focus-visible, .pictogram-row.clickable:focus-visible,
  .tally-chip:focus-visible, .add-btn:focus-visible, .name-chip:focus-visible{
    outline:3px solid var(--teal-600); outline-offset:2px;
  }

  /* ---------- path of stepping stones ---------- */
  .path-wrap{ position:relative;z-index:2; margin:6px auto 10px;max-width:1000px; overflow-x:auto;overflow-y:hidden; padding-block:14px 22px; }
  .path{ display:flex;align-items:flex-end;gap:14px;min-width:max-content;padding:0 6px; position:relative; }
  .path::before{ content:"";position:absolute;left:0;right:0;top:50%;height:0; border-top:5px dashed var(--border-card);z-index:0; }
  .stone{
    position:relative;z-index:1; width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center; font-family:var(--font-display);font-weight:700;font-size:14px;
    background:var(--teal-100);color:var(--ink-500); border:4px solid var(--white);box-shadow:0 4px 0 var(--edge-shadow-soft);
    flex:0 0 auto;transition:transform .2s ease, background .2s ease;
  }
  .stone:nth-child(odd){transform:translateY(-6px);}
  .stone:nth-child(even){transform:translateY(6px);}
  .stone.done{background:var(--grass);color:#fff;}
  .stone.current{background:var(--sun);color:#5a3c00;transform:translateY(-6px) scale(1.2);box-shadow:0 0 0 5px rgba(245,166,35,.35), 0 4px 0 var(--edge-shadow-soft);animation:stonepulse 1.6s ease-in-out infinite;}
  @keyframes stonepulse{0%,100%{box-shadow:0 0 0 5px rgba(245,166,35,.35),0 4px 0 var(--edge-shadow-soft);}50%{box-shadow:0 0 0 9px rgba(245,166,35,.16),0 4px 0 var(--edge-shadow-soft);}}
  .stone.trophy{background:linear-gradient(160deg,var(--sun),var(--berry));color:#fff;font-size:20px;}

  /* ---------- main stage ---------- */
  .stage{ position:relative;z-index:2; max-width:980px;margin:0 auto;padding-block:10px 60px; display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:start; }
  @media (max-width:760px){ .stage{grid-template-columns:1fr;} }

  .mascot-card{
    background:var(--white);border-radius:var(--r-lg);padding:18px 16px; text-align:center;box-shadow:0 8px 0 var(--edge-shadow-soft);
    position:sticky;top:14px;border:1px solid var(--border-card);
  }
  .mascot{ font-size:58px;display:inline-block; animation:bob 3s ease-in-out infinite; filter:drop-shadow(0 6px 6px rgba(0,0,0,.12)); }
  .mascot.happy{animation:jump .6s ease-in-out 2;}
  @keyframes jump{0%,100%{transform:translateY(0) rotate(0);}30%{transform:translateY(-18px) rotate(-8deg);}60%{transform:translateY(0) rotate(6deg);}}
  .speech-bubble{
    margin-top:10px;background:var(--bubble-tint);border-radius:var(--r-md);padding:12px;
    font-size:14px;font-weight:700;color:var(--plum);line-height:1.35;
    min-height:56px;display:flex;align-items:center;justify-content:center;
  }
  .mascot-name{font-family:var(--font-display);font-weight:700;color:var(--purple);font-size:13px;margin-top:6px;}

  .task-card{
    background:var(--white);border-radius:var(--r-lg);padding:22px 22px 20px; box-shadow:0 10px 0 var(--edge-shadow-soft);
    position:relative;overflow:hidden;border:1px solid var(--border-card); min-width:0;
  }
  .task-badge{
    display:inline-block;background:var(--sun);color:#5a3c00;font-weight:800; font-family:var(--font-display);font-size:12px;letter-spacing:.3px;
    padding:5px 14px;border-radius:999px;margin-bottom:10px;
  }
  .task-title{ font-family:var(--font-display);font-weight:700;font-size:clamp(22px,4vw,30px); margin:2px 0 6px;color:var(--plum); text-wrap:balance; }
  .task-instruction{ font-size:16px;font-weight:600;line-height:1.5;margin:0 0 16px;color:var(--ink-soft); display:flex;align-items:center;gap:8px; }
  .tap-hint{font-size:20px; animation:tapbob 1.3s ease-in-out infinite;}
  @keyframes tapbob{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-4px) rotate(-12deg);}}

  .play-zone{min-height:200px;display:flex;flex-direction:column;gap:16px;}
  .hint-msg{margin-top:4px;font-weight:800;font-size:15px;min-height:22px;text-align:center;}
  .hint-msg.err{color:var(--berry-dark);}
  .hint-msg.ok{color:var(--grass-dark);}

  /* ---------- shared object icon ---------- */
  .obj-icon{display:block; filter:drop-shadow(0 2px 2px rgba(0,0,0,.14));}
  .obj-icon svg{display:block;width:100%;height:100%;}
  @keyframes wiggle{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  .obj-wiggle{animation:wiggle 2.6s ease-in-out infinite;}

  /* ---------- pictogram block (read / compare / quiz) ---------- */
  .key-line{
    display:inline-flex;align-items:center;gap:8px;background:var(--panel-tint);border-radius:999px;
    padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;align-self:flex-start;
  }
  .key-line .obj-icon{width:20px;height:20px;}
  .pictogram-wrap{display:flex;flex-direction:column;gap:10px;}
  .pictogram-row{
    display:grid; grid-template-columns:104px 1fr; gap:10px; align-items:center;
    background:var(--panel-tint); border-radius:var(--r-md); padding:10px 14px; min-width:0;
    border:3px solid transparent; transition:transform .12s ease, border-color .15s ease, background .15s ease;
  }
  @media (max-width:480px){ .pictogram-row{grid-template-columns:76px 1fr;} }
  .pictogram-row.clickable{cursor:pointer;}
  .pictogram-row.clickable:hover{transform:translateY(-2px);}
  .row-label{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--plum);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1;}
  .row-label .obj-icon{width:26px;height:26px;}
  .pictogram-icons{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:30px;}
  .pictogram-icons .obj-icon{width:26px;height:26px;flex:0 0 auto;}
  .pictogram-row.wrong-flash{animation:shake .45s ease; border-color:var(--berry-dark);}
  .pictogram-row.right-flash{background:var(--bg-tint-gold); border-color:var(--sun);}
  @keyframes shake{10%,90%{transform:translateX(-3px);}20%,80%{transform:translateX(6px);}30%,50%,70%{transform:translateX(-10px);}40%,60%{transform:translateX(10px);}}

  .choice-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
  .choice-btn{
    min-width:58px;height:58px;padding:0 10px;border-radius:16px;font-size:20px;font-weight:800;border:none;cursor:pointer;
    background:var(--white);color:var(--plum);box-shadow:0 5px 0 var(--border-card); font-family:var(--font-display); transition:transform .12s ease;
  }
  .choice-btn:hover{transform:translateY(-2px);}
  .choice-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--border-card);}
  .choice-btn.wrong{animation:shake .45s ease;}
  .choice-btn.right{background:var(--grass);color:#fff;box-shadow:0 5px 0 var(--grass-dark);}

  /* ---------- tally (entering data) ---------- */
  .tally-pool{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;
    min-height:70px;background:var(--panel-tint);border-radius:var(--r-md);padding:14px;
  }
  .tally-pool:empty::after{content:"🎉 All counted!";font-weight:800;color:var(--grass-dark);font-family:var(--font-display);font-size:15px;}
  .tally-chip{ width:52px;height:52px;background:none;border:none;cursor:pointer;padding:4px;border-radius:14px; transition:transform .15s var(--ease); }
  .tally-chip:hover{transform:translateY(-2px) scale(1.06);}
  .tally-chip.gone{opacity:0;transform:scale(.3);pointer-events:none;}
  .tally-board{display:flex;flex-direction:column;gap:8px;}
  .tally-row{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;background:var(--bubble-tint);border-radius:var(--r-md);padding:8px 12px;min-width:0;}
  @media (max-width:480px){ .tally-row{grid-template-columns:70px 1fr 30px;} }
  .tally-row .row-label{flex-direction:row;gap:6px;font-size:13px;}
  .tally-row .row-label .obj-icon{width:22px;height:22px;}
  .tally-icons{display:flex;flex-wrap:wrap;gap:4px;min-height:24px;align-items:center;}
  .tally-icons .obj-icon{width:20px;height:20px;}
  .tally-count{
    display:flex;align-items:center;justify-content:center; width:30px;height:30px;border-radius:50%;
    background:var(--grass);color:#fff;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;
  }

  /* ---------- build (presenting information) ---------- */
  .data-table{display:flex;flex-direction:column;gap:6px;background:var(--panel-tint);border-radius:var(--r-md);padding:12px;}
  .data-table-title{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:2px;}
  .data-table-row{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--plum);}
  .data-table-row .obj-icon{width:22px;height:22px;}
  .data-table-row .dt-num{margin-left:auto;background:var(--white);border-radius:999px;padding:2px 10px;font-family:var(--font-display);font-variant-numeric:tabular-nums;}
  .build-board{display:flex;flex-direction:column;gap:10px;}
  .build-row{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;background:var(--bubble-tint);border-radius:var(--r-md);padding:10px 12px;min-width:0;}
  @media (max-width:480px){ .build-row{grid-template-columns:70px 1fr 40px;} }
  .build-icons{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:30px;}
  .build-icons .obj-icon{width:24px;height:24px;}
  .add-btn{
    width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;background:var(--grass);color:#fff;
    font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--grass-dark);transition:transform .12s ease;
  }
  .add-btn:hover{transform:translateY(-2px);}
  .add-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--grass-dark);}
  .add-btn.full{background:var(--teal-100);color:var(--grass-dark);box-shadow:none;cursor:default;}
  .add-btn.bump{animation:bump .3s ease;}
  @keyframes bump{30%{transform:scale(.85);}60%{transform:scale(1.15);}100%{transform:scale(1);}}

  .btn-primary,.btn-secondary,.btn-big{
    font-family:var(--font-body);font-weight:800;font-size:16px; border:none;border-radius:999px;padding:13px 26px;cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn-primary{background:var(--grass);color:#fff;box-shadow:0 5px 0 var(--grass-dark);}
  .btn-primary:hover{filter:brightness(1.05);transform:translateY(-2px);}
  .btn-primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--grass-dark);}
  .btn-secondary{background:var(--panel-tint);color:var(--plum);box-shadow:0 5px 0 var(--border-card);}
  .btn-big{background:var(--berry);color:#fff;font-size:18px;padding:15px 32px;box-shadow:0 5px 0 var(--berry-dark);}
  .btn-big:hover{transform:translateY(-2px);}
  .btn-big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--berry-dark);}

  /* ---------- name entry ---------- */
  .name-form{display:flex;flex-direction:column;gap:14px;align-items:center;}
  .name-input{
    width:100%;max-width:320px;font-size:22px;font-family:var(--font-display);font-weight:700;
    text-align:center;padding:14px 18px;border-radius:999px;border:3px solid var(--input-border);
    background:var(--input-bg);color:var(--plum);outline:none;
  }
  .name-input:focus{border-color:var(--teal-600);box-shadow:0 0 0 5px var(--bg-tint-teal);}
  .name-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:380px;}
  .name-chip{
    border:none;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;
    background:var(--panel-tint);color:var(--plum);transition:transform .12s ease;font-family:var(--font-body);
  }
  .name-chip:hover{transform:translateY(-2px);background:var(--bubble-tint);}

  .stage-label{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--purple);letter-spacing:.3px;}

  /* ---------- confetti ---------- */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
  .confetti-piece{position:absolute;top:-20px;border-radius:3px;animation:fall linear forwards;}
  @keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(105vh) rotate(540deg);opacity:.9;}}

  /* ---------- celebration overlay ---------- */
  .celebrate-overlay{
    position:fixed;inset:0;background:var(--overlay-tint); display:none;align-items:center;justify-content:center;z-index:60;
    padding-block:20px; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px));
  }
  .celebrate-overlay.show{display:flex;}
  .celebrate-card{
    background:var(--white);border-radius:var(--r-lg);padding:30px 28px;text-align:center;
    max-width:380px;width:100%;box-shadow:0 12px 0 var(--edge-shadow);

  function iconMarkup(kind, color){
    if(SHAPE_DRAW[kind]) return SHAPE_DRAW[kind](color || 'var(--fun-blue)');

    return '';

  function makeIconEl(kind, color, size, wiggle){
    var d = document.createElement('div');
    d.className = 'obj-icon' + (wiggle ? ' obj-wiggle' : '');
    d.style.width = size + 'px'; d.style.height = size + 'px';
    d.innerHTML = iconMarkup(kind, color);
    if(wiggle) d.style.animationDelay = (Math.random()*1.5) + 's';
    return d;
  }

  /* ================= UTIL ================= */
  function shuffle(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; return e; }

  /* ================= AUDIO ================= */
  var audioCtx = null, muted = false;
  function getCtx(){ if(!audioCtx){ var C = window.AudioContext||window.webkitAudioContext; if(C) audioCtx = new C(); } return audioCtx; }
  function beep(freq,dur,delay,vol){
    if(muted) return;
    var ctx = getCtx(); if(!ctx) return;
    var t0 = ctx.currentTime + (delay||0);
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.12,t0+.02); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+dur+.02);
  }

  function playYes(){ beep(523.25,.14,0); beep(659.25,.14,.1); beep(783.99,.22,.2); }

  function buildPictogramBlock(categories, opts){

      var row = el('div','pictogram-row' + (opts.clickable ? ' clickable' : ''));

      if(opts.clickable) row.tabIndex = 0;

  function buildPath(){
    pathTrack.innerHTML = '';
    var nameStone = el('div','stone'); nameStone.textContent = '👋'; nameStone.id='stone-name';
    pathTrack.appendChild(nameStone);
    tasks.forEach(function(t,i){
      var s = el('div','stone'); s.textContent = (i+1); s.id='stone-'+i;
      pathTrack.appendChild(s);
    });
    var trophy = el('div','stone trophy','🏆'); trophy.id='stone-trophy';
    pathTrack.appendChild(trophy);
  }
  function updatePath(){
    var nameStone = $('stone-name');
    nameStone.classList.toggle('done', state.index > -1);
    nameStone.classList.toggle('current', state.index === -1);
    tasks.forEach(function(t,i){
      var s = $('stone-'+i);
      s.classList.remove('done','current');
      if(i < state.index) s.classList.add('done');
      else if(i === state.index) s.classList.add('current');
    });
  }

  function setHint(msg, cls){ hintMsg.textContent = msg || ''; hintMsg.className = 'hint-msg' + (cls?(' '+cls):''); }
  function setSpeech(msg){ speechBubble.textContent = msg; }

  /* ================= NAME SCREEN ================= */
  var NAME_OPTIONS = ['Maya','Leo','Zara','Sam','Arjun','Priya','Noah','Mia'];
  function renderNameScreen(){
    taskBadge.textContent = 'Welcome!';
    taskTitle.textContent = "What's Your Name?";
    taskInstruction.innerHTML = '<span class="tap-hint">👋</span> Pick a name or type your own!';
    setSpeech("Hi there! I'm Kiki the Parrot. What should I call you?");
    mascotFace.textContent = '🦜'; mascotFace.classList.remove('happy');
    setHint('');
    updatePath();

    var wrap = el('div','name-form');
    var chips = el('div','name-chips');
    NAME_OPTIONS.forEach(function(n){
      var b = el('button','name-chip', n);
      b.type='button';
      b.addEventListener('click', function(){ playTap(); input.value = n; input.focus(); });
      chips.appendChild(b);
    });
    var input = el('input','name-input');
    input.type='text'; input.placeholder='Type your name...'; input.maxLength=20; input.id='nameInput';
    var go = el('button','btn-primary','Let\'s Play! 🚀');
    go.type='button';
    go.addEventListener('click', function(){
      var v = input.value.trim();
      if(!v){ setHint('Please tell me your name first! 😊','err'); playNo(); return; }
      state.playerName = v;
      playYes();
      mascotFace.textContent='🥳'; mascotFace.classList.add('happy');
      setSpeech('Hooray, ' + v + '! Let\'s count things together!');
      burstConfetti(18);
      setTimeout(function(){ state.index = 0; renderTask(); }, 650);
    });
    input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); go.click(); } });

    wrap.appendChild(chips); wrap.appendChild(input); wrap.appendChild(go);
    playZone.innerHTML=''; playZone.appendChild(wrap);
    setTimeout(function(){ input.focus(); }, 200);
  }

  /* ================= TASK ROUTER ================= */
  function renderTask(){
    if(state.index === -1){ renderNameScreen(); return; }
    if(state.index >= tasks.length){ showFinal(); return; }
    var t = tasks[state.index];
    taskBadge.textContent = 'Level ' + (state.index+1) + ' of ' + tasks.length;
    taskTitle.textContent = t.title;
    taskInstruction.innerHTML = '<span class="tap-hint">👆</span> ' + t.instr;
    setHint('');
    mascotFace.textContent = '🦜'; mascotFace.classList.remove('happy');
    setSpeech(t.title + '!');
    updatePath();
    playZone.innerHTML = '';

    if(t.type === 'read') renderRead(t);
    else if(t.type === 'compare') renderCompare(t);
    else if(t.type === 'tally') renderTally(t);
    else if(t.type === 'build') renderBuild(t);
    else if(t.type === 'quiz') renderQuiz(t);
    else if(t.type === 'grand') renderGrand(t);
  }

  function taskComplete(){
    playYes();
    state.stars += 1;
    starCount.textContent = state.stars;
    mascotFace.textContent = '🥳'; mascotFace.classList.add('happy');
    var line = pick(encourage);
    setSpeech(line);
    burstConfetti();
    celebrateEmoji.textContent = pick(['🎉','🌟','🥳','🎈','🚀','🏅','✨']);
    celebrateTitle.textContent = line;
    celebrateMsg.textContent = (state.index === tasks.length-1) ? 'You finished every challenge!' : 'Ready for the next challenge?';
    celebrateOverlay.classList.add('show');
  }
  nextBtn.addEventListener('click', function(){
    celebrateOverlay.classList.remove('show');
    state.index += 1;
    renderTask();
  });

  /* ================= 1. READ THE PICTOGRAM (counting) ================= */
  function renderRead(t){
    var roundIdx = 0;
    function renderRound(){
      var askKey = t.askKeys[roundIdx];
      var cat = t.dataset.filter(function(c){return c.key===askKey;})[0];
      taskInstruction.innerHTML = '<span class="tap-hint">👆</span> How many chose <b>' + cat.label + '</b>?';
      var pictBlock = buildPictogramBlock(t.dataset, {});
      var choicesWrap = el('div','choice-row');
      var options = [cat.count];
      while(options.length < 4){
        var delta = pick([-2,-1,1,2]);
        var cand = Math.max(1, Math.min(9, cat.count+delta));
        if(options.indexOf(cand) === -1) options.push(cand);
      }
      options = shuffle(options);
      options.forEach(function(n){
        var btn = el('button','choice-btn', String(n));
        btn.type='button';
        btn.addEventListener('click', function(){
          if(n === cat.count){
            playYes(); btn.classList.add('right');
            setHint('Yes, ' + n + ' is right! 🎉','ok');
            roundIdx += 1;
            if(roundIdx >= t.askKeys.length){ setTimeout(taskComplete, 450); }
            else { setTimeout(function(){ playZone.innerHTML=''; renderRound(); setHint(''); }, 650); }
          } else {
            playNo(); btn.classList.add('wrong');
            setTimeout(function(){ btn.classList.remove('wrong'); }, 420);
            setHint(pick(tryAgainMsgs),'err');
          }
        });
        choicesWrap.appendChild(btn);
      });
      playZone.innerHTML='';
      playZone.appendChild(pictBlock);
      playZone.appendChild(choicesWrap);
    }
    renderRound();
  }

  /* ================= 2. COMPARE (more / fewer) ================= */
  function renderCompare(t){
    var roundIdx = 0;
    function renderRound(){
      var ask = t.asks[roundIdx];
      taskInstruction.innerHTML = '<span class="tap-hint">👆</span> Tap the row with ' + (ask==='more' ? 'MORE' : 'FEWER') + '.';
      var counts = t.dataset.map(function(c){return c.count;});
      var correctKey = (ask==='more')
        ? t.dataset.filter(function(c){return c.count===Math.max.apply(null,counts);})[0].key
        : t.dataset.filter(function(c){return c.count===Math.min.apply(null,counts);})[0].key;
      var block = buildPictogramBlock(t.dataset, {
        clickable:true,
        onClick:function(key, rowEl){
          if(key === correctKey){
            playYes(); rowEl.classList.add('right-flash');
            setHint('That one has ' + (ask==='more'?'more':'fewer') + '! 🎉','ok');
            roundIdx += 1;
            if(roundIdx >= t.asks.length){ setTimeout(taskComplete, 450); }
            else { setTimeout(function(){ playZone.innerHTML=''; renderRound(); setHint(''); }, 650); }
          } else {
            playNo();
            rowEl.classList.remove('wrong-flash'); void rowEl.offsetWidth; rowEl.classList.add('wrong-flash');
            setTimeout(function(){ rowEl.classList.remove('wrong-flash'); }, 460);
            setHint(pick(tryAgainMsgs),'err');
          }
        }
      });
      playZone.innerHTML=''; playZone.appendChild(block);
    }
    renderRound();
  }

  /* ================= 3. TALLY (entering data) ================= */
  function renderTallyBoard(raw, categories, onDone){
    var pool = el('div','tally-pool');
    var board = el('div','tally-board');
    var counts = {}; var iconEls = {};
    categories.forEach(function(cat){
      counts[cat.key] = 0;
      var row = el('div','tally-row');
      var label = el('div','row-label');
      label.appendChild(makeIconEl(cat.icon, cat.color, 22, false));
      var span = document.createElement('span'); span.textContent = cat.label;
      label.appendChild(span);
      var icons = el('div','tally-icons');
      var count = el('div','tally-count','0');
      row.appendChild(label); row.appendChild(icons); row.appendChild(count);
      board.appendChild(row);
      iconEls[cat.key] = {icons:icons, count:count};
    });

    var remaining = raw.length;
    raw.forEach(function(kind){
      var cat = categories.filter(function(c){return c.key===kind;})[0];
      var chip = el('button','tally-chip');
      chip.type='button';
      chip.appendChild(makeIconEl(kind, cat.color, 44, true));
      chip.addEventListener('click', function(){
        if(chip.classList.contains('gone')) return;
        playTap();
        chip.classList.add('gone');
        counts[kind] += 1;
        iconEls[kind].icons.appendChild(makeIconEl(kind, cat.color, 20, false));
        iconEls[kind].count.textContent = counts[kind];
        remaining -= 1;
        if(remaining <= 0){ setTimeout(function(){ onDone(counts); }, 400); }
      });
      pool.appendChild(chip);
    });

    var wrap = el('div');
    wrap.appendChild(pool); wrap.appendChild(board);
    return wrap;
  }
  function renderTally(t){
    var wrap = renderTallyBoard(t.raw, t.categories, function(counts){
      setHint('Every item counted! 🎉','ok');
      setTimeout(taskComplete, 350);
    });
    playZone.innerHTML=''; playZone.appendChild(wrap);
  }

  /* ================= 4. BUILD (presenting information) ================= */
  function renderBuildBoard(dataset, onDone){
    var table = el('div','data-table');
    var title = el('div','data-table-title','📋 Data to show:');
    table.appendChild(title);
    dataset.forEach(function(cat){
      var row = el('div','data-table-row');
      row.appendChild(makeIconEl(cat.icon, cat.color, 22, false));
      var span = document.createElement('span'); span.textContent = cat.label;
      row.appendChild(span);
      var num = el('span','dt-num', String(cat.count));
      row.appendChild(num);
      table.appendChild(row);
    });

    var board = el('div','build-board');
    var progress = {}; var doneCount = 0;
    dataset.forEach(function(cat){
      progress[cat.key] = 0;
      var row = el('div','build-row');
      var label = el('div','row-label');
      label.appendChild(makeIconEl(cat.icon, cat.color, 22, false));
      var span = document.createElement('span'); span.textContent = cat.label;
      label.appendChild(span);
      var icons = el('div','build-icons');
      var addBtn = el('button','add-btn','➕');
      addBtn.type='button';
      row.appendChild(label); row.appendChild(icons); row.appendChild(addBtn);
      addBtn.addEventListener('click', function(){
        if(progress[cat.key] >= cat.count){
          addBtn.classList.remove('bump'); void addBtn.offsetWidth; addBtn.classList.add('bump');
          return;
        }
        playTap();
        progress[cat.key] += 1;
        icons.appendChild(makeIconEl(cat.icon, cat.color, 24, false));
        if(progress[cat.key] >= cat.count){
          addBtn.textContent = '✓'; addBtn.classList.add('full');
          doneCount += 1;
          if(doneCount >= dataset.length){ setTimeout(function(){ onDone(); }, 350); }
        }
      });
      board.appendChild(row);
    });

    var wrap = el('div');
    wrap.appendChild(table); wrap.appendChild(board);
    return wrap;
  }
  function renderBuild(t){
    var wrap = renderBuildBoard(t.dataset, function(){
      setHint('Pictogram complete! 🎉','ok');
      setTimeout(taskComplete, 350);
    });
    playZone.innerHTML=''; playZone.appendChild(wrap);
  }

  /* ================= 5. QUIZ (read + interpret) ================= */
  function renderQuiz(t){
    var roundIdx = 0;
    function renderRound(){
      var kind = t.rounds[roundIdx];
      var counts = t.dataset.map(function(c){return c.count;});
      var total = counts.reduce(function(a,b){return a+b;},0);
      if(kind === 'most' || kind === 'least'){
        taskInstruction.innerHTML = '<span class="tap-hint">👆</span> Which is the ' + (kind==='most'?'MOST':'LEAST') + ' popular?';
        var target = (kind==='most') ? Math.max.apply(null,counts) : Math.min.apply(null,counts);
        var correctKey = t.dataset.filter(function(c){return c.count===target;})[0].key;
        var block = buildPictogramBlock(t.dataset, {
          clickable:true,
          onClick:function(key, rowEl){
            if(key === correctKey){
              playYes(); rowEl.classList.add('right-flash');
              setHint('Yes, that\'s the ' + (kind==='most'?'most':'least') + ' popular! 🎉','ok');
              advance();
            } else {
              playNo();
              rowEl.classList.remove('wrong-flash'); void rowEl.offsetWidth; rowEl.classList.add('wrong-flash');
              setTimeout(function(){ rowEl.classList.remove('wrong-flash'); }, 460);
              setHint(pick(tryAgainMsgs),'err');
            }
          }
        });
        playZone.innerHTML=''; playZone.appendChild(block);
      } else {
        taskInstruction.innerHTML = '<span class="tap-hint">👆</span> How many votes in total?';
        var block2 = buildPictogramBlock(t.dataset, {});
        var choicesWrap = el('div','choice-row');
        var options = [total];
        while(options.length < 4){
          var delta = pick([-2,-1,1,2,3]);
          var cand = Math.max(1, total+delta);
          if(options.indexOf(cand) === -1) options.push(cand);
        }
        options = shuffle(options);
        options.forEach(function(n){
          var btn = el('button','choice-btn', String(n));
          btn.type='button';
          btn.addEventListener('click', function(){
            if(n === total){
              playYes(); btn.classList.add('right');
              setHint('Yes, ' + n + ' in total! 🎉','ok');
              advance();
            } else {
              playNo(); btn.classList.add('wrong');
              setTimeout(function(){ btn.classList.remove('wrong'); }, 420);
              setHint(pick(tryAgainMsgs),'err');
            }
          });
          choicesWrap.appendChild(btn);
        });
        playZone.innerHTML='';
        playZone.appendChild(block2);
        playZone.appendChild(choicesWrap);
      }
    }
    function advance(){
      roundIdx += 1;
      if(roundIdx >= t.rounds.length){ setTimeout(taskComplete, 450); }
      else { setTimeout(function(){ setHint(''); renderRound(); }, 650); }
    }
    renderRound();
  }

  /* ================= 6. GRAND CHALLENGE (tally -> build -> quiz) ================= */
  function renderGrand(t){
    var phase = 0;
    function showStageLabel(n, text){
      var lbl = el('div','stage-label', 'Step ' + n + ' of 3 — ' + text);
      return lbl;
    }
    function phaseTally(){
      taskInstruction.innerHTML = '<span class="tap-hint">👆</span> First, collect the data! Tap each icon.';
      var lbl = showStageLabel(1,'Collect the data');
      var board = renderTallyBoard(t.raw, t.categories, function(counts){
        setHint('Data collected! Now let\'s build it. 🎉','ok');
        setTimeout(function(){ phase = 1; phaseBuild(counts); }, 600);
      });
      playZone.innerHTML=''; playZone.appendChild(lbl); playZone.appendChild(board);
    }
    function phaseBuild(counts){
      setHint('');
      taskInstruction.innerHTML = '<span class="tap-hint">👆</span> Now build the pictogram from your data!';
      var lbl = showStageLabel(2,'Build the pictogram');
      var builtDataset = t.categories.map(function(cat){
        return {key:cat.key, label:cat.label, icon:cat.icon, color:cat.color, count:counts[cat.key]};
      });
      var board = renderBuildBoard(builtDataset, function(){
        setHint('Pictogram built! One last question. 🎉','ok');
        setTimeout(function(){ phase = 2; phaseQuiz(builtDataset); }, 600);
      });
      playZone.innerHTML=''; playZone.appendChild(lbl); playZone.appendChild(board);
    }
    function phaseQuiz(builtDataset){
      setHint('');
      taskInstruction.innerHTML = '<span class="tap-hint">👆</span> Which was the MOST popular?';
      var lbl = showStageLabel(3,'Answer the question');
      var counts = builtDataset.map(function(c){return c.count;});
      var correctKey = builtDataset.filter(function(c){return c.count===Math.max.apply(null,counts);})[0].key;
      var block = buildPictogramBlock(builtDataset, {
        clickable:true,
        onClick:function(key, rowEl){
          if(key === correctKey){
            playYes(); rowEl.classList.add('right-flash');
            setHint('Yes! You collected, built AND read the data! 🎉','ok');
            setTimeout(taskComplete, 500);
          } else {
            playNo();
            rowEl.classList.remove('wrong-flash'); void rowEl.offsetWidth; rowEl.classList.add('wrong-flash');
            setTimeout(function(){ rowEl.classList.remove('wrong-flash'); }, 460);
            setHint(pick(tryAgainMsgs),'err');
          }
        }
      });
      playZone.innerHTML=''; playZone.appendChild(lbl); playZone.appendChild(block);
    }
    phaseTally();
  }

  /* ================= FINAL CERTIFICATE ================= */
  function showFinal(){
    certName.textContent = state.playerName || 'Data Star';
    certStars.textContent = state.stars;
    certBadges.innerHTML = '';
    [['apple',null,'Counting'],['cat',null,'Comparing'],['ball',null,'Pictograms']].forEach(function(b){
      var wrap = el('div','cert-badge');
      wrap.appendChild(makeIconEl(b[0], b[1]||'var(--fun-blue)', 34, false));
      var lbl = el('div',null,b[2]); wrap.appendChild(lbl);
      certBadges.appendChild(wrap);
    });
    finalOverlay.classList.add('show');
    burstConfetti(60);
  }
  restartBtn.addEventListener('click', function(){
    state.index = -1; state.stars = 0; starCount.textContent = 0;
    finalOverlay.classList.remove('show');
    renderTask();
  });

  /* ================= MUTE ================= */
  muteBtn.addEventListener('click', function(){
    muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  /* ================= INIT ================= */
  function boot(data){
    buildPath();
    renderTask();
  }
  if(window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data||{});
  } else {
    boot({});
  }
})();
</script>

</body></html>
